<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Mak Stream</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mak Stream">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
    padding-bottom: 80px; /* ለታችኛው አሞሌ እና አዲስ ቁልፍ ቦታ */
  }

  header {
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-bottom: 14px; padding-left: 18px; padding-right: 18px;
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header h1 { font-size: 20px; font-weight: 700; flex: 1; }
  header .ball { font-size: 22px; }

  main { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }

  /* ---- የጣቢያ ካርዶች ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 18px 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    min-height: 110px;
    cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
    text-align: center;
    position: relative;
  }
  .card:active {
    transform: scale(.96);
    background: #21262d;
    border-color: #58a6ff;
  }
  .card .icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  .card .label {
    font-size: 14px; font-weight: 600; line-height: 1.2;
  }
  
  /* የተወዳጅ እና የማጥፊያ ምልክቶች */
  .card .star {
    position: absolute; top: 6px; right: 30px;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: #7d8590; cursor: pointer;
  }
  .card .star.on { color: #f7c948; }
  
  .card .delete-btn {
    position: absolute; top: 6px; right: 2px;
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #da3633; cursor: pointer;
  }

  /* ---- አዲስ ሳይት መጨመሪያ ቁልፍ ---- */
  .add-btn-container {
    position: fixed; bottom: 75px; left: 16px; right: 16px;
    z-index: 90;
  }
  .add-btn {
    width: 100%; padding: 14px;
    background: #238636; color: #fff;
    border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.5);
  }
  .add-btn:active { background: #2ea043; transform: scale(.98); }

  /* ---- የስልክ ማሳያ (Modal) ---- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.7);
    display: none; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  
  .modal {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 16px; padding: 20px;
    width: 100%; max-width: 400px;
  }
  .modal h2 { font-size: 18px; margin-bottom: 16px; text-align: center; }
  
  .modal input {
    width: 100%; padding: 12px;
    background: #0d1117; border: 1px solid #30363d;
    border-radius: 8px; color: #fff; font-size: 15px;
    margin-bottom: 12px; outline: none;
  }
  .modal input:focus { border-color: #58a6ff; }
  
  .modal-actions {
    display: flex; gap: 10px; margin-top: 10px;
  }
  .modal-actions button {
    flex: 1; padding: 12px;
    border: none; border-radius: 8px;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .btn-cancel { background: #21262d; color: #e6edf3; }
  .btn-save { background: #1f6feb; color: #fff; }

  .empty, .loading {
    text-align: center; padding: 30px 20px;
    color: #7d8590; font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <span class="ball">⚽</span>
  <h1>Mak Stream</h1>
</header>

<main>
  <div id="homeView" class="view active">
    <div id="grid" class="grid"></div>
  </div>
</main>

<!-- አዲስ ሳይት መጨመሪያ ቁልፍ -->
<div class="add-btn-container">
  <button class="add-btn" id="openAddModal">
    <span>➕</span> አዲስ ሳይት ጨምር
  </button>
</div>

<!-- የስልክ ማሳያ (Modal) -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>አዲስ ሳይት ጨምር</h2>
    <input type="text" id="siteName" placeholder="የሳይቱ ስም (ለምሳሌ፡ HesGoal)" />
    <input type="url" id="siteUrl" placeholder="የሳይቱ ሊንክ (https://...)" />
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelAdd">ሰርዝ</button>
      <button class="btn-save" id="saveSite">አስቀምጥ</button>
    </div>
  </div>
</div>

<script>
/* ============================================
   📌 ነባሪ የጣቢያዎች ዝርዝር
   ============================================ */
const DEFAULT_SITES = [
  { id: "hesgoal",  name: "HesGoal",      emoji: "H", url: "https://hesgoal-tv.space" },
  { id: "yalla",    name: "Yalla Shoot",  emoji: "Y", url: "https://www.yalla-shoot.tv" },
  { id: "vip",      name: "VIPLeague",    emoji: "V", url: "https://vipleague.pm" },
  { id: "total",    name: "Totalsportek", emoji: "T", url: "https://totalsportek.com" },
  { id: "footybite",name: "FootyBite",    emoji: "F", url: "https://footybite.to" },
  { id: "sportsurge",name: "Sportsurge",  emoji: "S", url: "https://sportsurge.net" },
];

/* ============================================
   📌 የራስህን ጣቢያዎች መጨመሪያ/ማጥፊያ ስርዓት (LocalStorage)
   ============================================ */
function getSites() {
  try {
    const stored = localStorage.getItem('makCustomSites');
    if (stored) {
      return JSON.parse(stored);
    }
  } catch (e) {}
  return DEFAULT_SITES;
}

function saveSites(sites) {
  localStorage.setItem('makCustomSites', JSON.stringify(sites));
}

const grid = document.getElementById('grid');

/* ---------- ተወዳጅ ጣቢያዎች ---------- */
function getFavs() {
  try { return JSON.parse(localStorage.getItem('makFavs') || '[]'); }
  catch { return []; }
}
function saveFavs(list) { localStorage.setItem('makFavs', JSON.stringify(list)); }

function toggleFav(id) {
  const favs = getFavs();
  const i = favs.indexOf(id);
  if (i >= 0) favs.splice(i, 1); else favs.push(id);
  saveFavs(favs);
  renderSites();
}

function isFav(id) { return getFavs().includes(id); }

/* ---------- ካርድ መስሪያ ---------- */
function makeSiteCard(site) {
  const fav = isFav(site.id);
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <span class="star ${fav ? 'on' : ''}">${fav ? '⭐' : '☆'}</span>
    <span class="delete-btn" title="አጥፋ">🗑️</span>
    <div class="icon">${site.emoji}</div>
    <div class="label">${site.name}</div>
  `;

  // ተወዳጅ ማድረግ
  card.querySelector('.star').addEventListener('click', e => {
    e.stopPropagation();
    toggleFav(site.id);
  });

  // ማጥፋት
  card.querySelector('.delete-btn').addEventListener('click', e => {
    e.stopPropagation();
    if (confirm(`"${site.name}" ማጥፋት ትፈልጋለህ?`)) {
      let sites = getSites();
      sites = sites.filter(s => s.id !== site.id);
      saveSites(sites);
      renderSites();
    }
  });

  // መክፈት
  card.addEventListener('click', () => {
    window.open(site.url, '_blank');
  });

  return card;
}

/* ---------- ጣቢያዎችን አሳይ ---------- */
function renderSites() {
  grid.innerHTML = '';
  const sites = getSites();
  sites.forEach(site => grid.appendChild(makeSiteCard(site)));
}

/* ---------- አዲስ ሳይት መጨመሪያ ስርዓት ---------- */
const addModal = document.getElementById('addModal');
const openAddBtn = document.getElementById('openAddModal');
const cancelAddBtn = document.getElementById('cancelAdd');
const saveSiteBtn = document.getElementById('saveSite');
const siteNameInput = document.getElementById('siteName');
const siteUrlInput = document.getElementById('siteUrl');

openAddBtn.addEventListener('click', () => {
  addModal.classList.add('open');
  siteNameInput.value = '';
  siteUrlInput.value = '';
});

cancelAddBtn.addEventListener('click', () => {
  addModal.classList.remove('open');
});

saveSiteBtn.addEventListener('click', () => {
  const name = siteNameInput.value.trim();
  let url = siteUrlInput.value.trim();

  if (!name || !url) {
    alert('እባክህ ስምና ሊንክ ሁለቱንም አስገባ።');
    return;
  }

  // ሊንኩ http/https ካልተጀመረ ራስ-ሰር ጨምር
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    url = 'https://' + url;
  }

  const newSite = {
    id: 'site_' + Date.now(),
    name: name,
    emoji: name.charAt(0).toUpperCase(),
    url: url
  };

  const sites = getSites();
  sites.push(newSite);
  saveSites(sites);
  
  addModal.classList.remove('open');
  renderSites();
});

/* ---------- ማስጀመሪያ ---------- */
renderSites();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
