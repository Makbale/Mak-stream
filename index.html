<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Mak Stream</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mak Stream">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ---- ራስጌ ---- */
  header {
    padding: 14px 18px calc(14px + env(safe-area-inset-top));
    padding-top: calc(14px + env(safe-area-inset-top));
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
  header .ball { font-size: 22px; }

  /* ---- የካርድ አካባቢ ---- */
  main {
    flex: 1; overflow-y: auto; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 14px;
    padding: 18px 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px;
    min-height: 110px;
    cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
    text-align: center;
  }
  .card:active {
    transform: scale(.96);
    background: #21262d;
    border-color: #58a6ff;
  }
  .card .icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  .card .label {
    font-size: 14px; font-weight: 600; line-height: 1.2;
  }
  .card .sub {
    font-size: 11px; color: #7d8590;
  }

  /* ---- የመጨመሪያ ካርድ ---- */
  .card.add {
    border-style: dashed;
    background: transparent;
  }
  .card.add .icon {
    background: #21262d; color: #58a6ff;
  }

  /* ---- የታች ማሳሰቢያ ---- */
  footer {
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    font-size: 11px; color: #7d8590; text-align: center;
    background: #0d1117; border-top: 1px solid #21262d;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<header>
  <span class="ball">⚽</span>
  <h1>Mak Stream</h1>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>ለግል አገልግሎት ብቻ · Mak Stream</footer>

<script>
/* ============================================
   📌 የራስህን ጣቢያዎች እዚህ ጨምር / ቀይር
   ============================================ */
const SITES = [
  { name: "HesGoal",     emoji: "H",  url: "https://hesgoal-tv.space" },
  { name: "Yalla Shoot", emoji: "Y",  url: "https://www.yalla-shoot.tv" },
  { name: "VIPLeague",   emoji: "V",  url: "https://vipleague.pm" },
  { name: "Totalsportek",emoji: "T",  url: "https://totalsportek.com" },
  { name: "CazéTV",      emoji: "C",  url: "https://www.youtube.com/@CazeTV" },
];
/* ============================================ */

const grid = document.getElementById('grid');

function openSite(site) {
  // ስልክ ላይ iframe ብዙ ጊዜ ስለማይሰራ በቀጥታ አዲስ ታብ እንከፍት
  window.open(site.url, '_blank');
}

function render() {
  grid.innerHTML = '';

  SITES.forEach(site => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="icon">${site.emoji}</div>
      <div class="label">${site.name}</div>
      <div class="sub">ተጫን →</div>
    `;
    card.onclick = () => openSite(site);
    grid.appendChild(card);
  });

  // የመጨመሪያ ካርድ
  const add = document.createElement('div');
  add.className = 'card add';
  add.innerHTML = `
    <div class="icon">+</div>
    <div class="label">አዲስ ጣቢያ</div>
    <div class="sub">ኮዱን ቀይር</div>
  `;
  add.onclick = () => {
    alert("index.html ውስጥ 'SITES' የሚለውን ዝርዝር ፈልገህ አዲስ ጣቢያ ጨምር።");
  };
  grid.appendChild(add);
}

render();
</script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
