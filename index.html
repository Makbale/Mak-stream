<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Mak Stream</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mak Stream">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #0d1117; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    padding-top: calc(14px + env(safe-area-inset-top));
    padding-bottom: 14px; padding-left: 18px; padding-right: 18px;
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: .5px; flex: 1; }
  header .ball { font-size: 22px; }
  header .refresh {
    background: rgba(255,255,255,.18); border: none; color: #fff;
    width: 38px; height: 38px; border-radius: 50%;
    font-size: 18px; cursor: pointer;
  }
  header .refresh:active { transform: scale(.9); }
  header .refresh.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search-bar {
    padding: 12px 16px 0; flex-shrink: 0;
  }
  .search-bar input {
    width: 100%; padding: 12px 16px;
    background: #161b22; border: 1px solid #30363d;
    border-radius: 10px; color: #e6edf3; font-size: 15px;
    outline: none;
  }
  .search-bar input:focus { border-color: #58a6ff; }

  main {
    flex: 1; overflow-y: auto; padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling: touch;
  }

  section { margin-bottom: 24px; }
  section h2 {
    font-size: 14px; color: #7d8590;
    text-transform: uppercase; letter-spacing: .8px;
    margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
  }
  section h2 .count {
    background: #21262d; padding: 2px 8px; border-radius: 10px;
    font-size: 11px; color: #7d8590;
  }

  /* ---- የጨዋታ ካርዶች ---- */
  .match {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .match-top {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: #7d8590;
  }
  .match-league { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .match-time {
    background: #21262d; padding: 2px 8px; border-radius: 6px;
    color: #58a6ff; font-weight: 600; flex-shrink: 0;
  }
  .match.live .match-time { background: #da3633; color: #fff; }
  .match.live .match-time::before { content: "🔴 "; }
  .match-body {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 600; gap: 8px;
  }
  .match-body .team { flex: 1; }
  .match-body .team.away { text-align: right; }
  .match-body .vs {
    color: #7d8590; font-size: 12px; font-weight: 400; flex-shrink: 0;
  }

  /* ---- የጣቢያ ካርዶች ---- */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
  }
  .card {
    background: #161b22; border: 1px solid #30363d;
    border-radius: 14px; padding: 16px 12px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    min-height: 100px; cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
    text-align: center;
  }
  .card:active {
    transform: scale(.96); background: #21262d; border-color: #58a6ff;
  }
  .card .icon {
    width: 44px; height: 44px; border-radius: 50%;
    background: linear-gradient(135deg, #1f6feb, #238636);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
  }
  .card .label { font-size: 14px; font-weight: 600; line-height: 1.2; }

  /* ---- ሁኔታዎች ---- */
  .empty, .loading {
    text-align: center; padding: 30px 20px;
    color: #7d8590; font-size: 13px;
  }
  .empty a { color: #58a6ff; text-decoration: none; }
</style>
</head>
<body>

<header>
  <span class="ball">⚽</span>
  <h1>Mak Stream</h1>
  <button class="refresh" id="refresh" title="አድስ">🔄</button>
</header>

<div class="search-bar">
  <input type="search" id="search" placeholder="ጣቢያ ፈልግ...">
</div>

<main>
  <section>
    <h2>🔴 የዛሬ ጨዋታዎች <span class="count" id="matchCount">0</span></h2>
    <div id="matches" class="loading">በመጫን ላይ...</div>
  </section>

  <section>
    <h2>📺 ጣቢያዎች <span class="count" id="siteCount">0</span></h2>
    <div id="grid" class="grid"></div>
  </section>
</main>

<script>
/* ============================================
   📌 የራስህን ጣቢያዎች እዚህ ጨምር / ቀይር
   ============================================ */
const SITES = [
  { name: "HesGoal",     emoji: "H",  url: "https://hesgoal-tv.space" },
  { name: "Yalla Shoot", emoji: "Y",  url: "https://www.yalla-shoot.tv" },
  { name: "VIPLeague",   emoji: "V",  url: "https://vipleague.pm" },
  { name: "Totalsportek",emoji: "T",  url: "https://totalsportek.com" },
  { name: "CazéTV",      emoji: "C",  url: "https://www.youtube.com/@CazeTV" },
];
/* ============================================ */

const grid = document.getElementById('grid');
const matchesEl = document.getElementById('matches');
const searchInput = document.getElementById('search');
const refreshBtn = document.getElementById('refresh');
const matchCount = document.getElementById('matchCount');
const siteCount = document.getElementById('siteCount');

/* ---------- የጣቢያ ካርዶች ---------- */
function renderSites(filter = '') {
  const q = filter.trim().toLowerCase();
  const filtered = q
    ? SITES.filter(s => s.name.toLowerCase().includes(q))
    : SITES;

  grid.innerHTML = '';
  siteCount.textContent = filtered.length;

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">ምንም አልተገኘም</div>';
    return;
  }

  filtered.forEach(site => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="icon">${site.emoji}</div>
      <div class="label">${site.name}</div>
    `;
    card.onclick = () => window.open(site.url, '_blank');
    grid.appendChild(card);
  });
}

searchInput.addEventListener('input', e => renderSites(e.target.value));

/* ---------- የጨዋታ መርሃግር ---------- */
async function loadMatches() {
  matchesEl.className = 'loading';
  matchesEl.textContent = 'በመጫን ላይ...';

  const today = new Date().toISOString().split('T')[0]; // YYYY-MM-DD
  const url = `https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${today}&s=Soccer`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network error');
    const data = await res.json();

    const events = (data.events || []).filter(e => e.strSport === 'Soccer');

    if (events.length === 0) {
      matchesEl.className = 'empty';
      matchesEl.textContent = 'ዛሬ ምንም ጨዋታ አልተገኘም።';
      matchCount.textContent = '0';
      return;
    }

    // በሰዓት አስቀድም
    events.sort((a, b) => {
      const ta = a.strTimestamp || '9999';
      const tb = b.strTimestamp || '9999';
      return ta.localeCompare(tb);
    });

    matchesEl.className = '';
    matchesEl.innerHTML = '';
    matchCount.textContent = events.length;

    events.forEach(ev => {
      const time = (ev.strTime || '').slice(0, 5) || '—';
      const isLive = ev.strStatus === 'Live' || ev.strStatus === '1H'
                  || ev.strStatus === '2H' || ev.strStatus === 'HT';
      const card = document.createElement('div');
      card.className = 'match' + (isLive ? ' live' : '');
      card.innerHTML = `
        <div class="match-top">
          <span class="match-league">${ev.strLeague || '—'}</span>
          <span class="match-time">${time}</span>
        </div>
        <div class="match-body">
          <span class="team">${ev.strHomeTeam || '?'}</span>
          <span class="vs">vs</span>
          <span class="team away">${ev.strAwayTeam || '?'}</span>
        </div>
      `;
      matchesEl.appendChild(card);
    });
  } catch (err) {
    matchesEl.className = 'empty';
    matchesEl.innerHTML = 'ጨዋታዎችን ማምጣት አልተቻለም።<br>ኢንተርኔትህን አረጋግጥ።';
    matchCount.textContent = '0';
  }
}

refreshBtn.addEventListener('click', async () => {
  refreshBtn.classList.add('spin');
  await loadMatches();
  refreshBtn.classList.remove('spin');
});

/* ---------- ማስጀመሪያ ---------- */
renderSites();
loadMatches();

/* ---------- Service Worker ---------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
